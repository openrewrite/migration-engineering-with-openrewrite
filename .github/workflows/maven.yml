name: Maven Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: "maven-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest

    # Activates the codegenome profile in pom.xml; empty on pull requests from forks, which
    # receive no secrets, leaving the profile inactive so those builds resolve from Central.
    env:
      CODEGENOME_USERNAME: ${{ secrets.CODEGENOME_USERNAME }}
      CODEGENOME_TOKEN: ${{ secrets.CODEGENOME_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
          server-id: codegenome
          server-username: CODEGENOME_USERNAME
          server-password: CODEGENOME_TOKEN

      - name: Build with Maven
        run: mvn verify

      - name: Apply OpenRewrite recipes
        run: mvn -U org.openrewrite.maven:rewrite-maven-plugin:run -Drewrite.recipeArtifactCoordinates=org.openrewrite.recipe:rewrite-testing-frameworks:RELEASE -Drewrite.activeRecipes=org.openrewrite.java.testing.assertj.Assertj -Drewrite.exportDatatables=true

      - name: Verify still works
        run: mvn verify
